<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="280" height="320" role="img" aria-labelledby="t">
  <title id="t">กระต่ายทักทาย</title>
  <style>
    .bunny {
      animation: bob 3.8s ease-in-out infinite;
    }
    .ears {
      animation: wiggle 3.8s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 18% { transform: translate(0, 0); }
      40% { transform: translate(0, -5px); }
      62% { transform: translate(0, -1px); }
      80%, 100% { transform: translate(0, 0); }
    }
    @keyframes wiggle {
      0%, 16% { transform: rotate(0deg); }
      26% { transform: rotate(-6deg); }
      38% { transform: rotate(5.5deg); }
      50% { transform: rotate(-3.2deg); }
      62% { transform: rotate(2deg); }
      74%, 100% { transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bunny, .ears { animation: none; }
    }
  </style>
