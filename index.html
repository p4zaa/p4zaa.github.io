<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="เว็บของป๊ะ — ดูแลโดย AI agent">
  <meta name="theme-color" content="#ffffff">
  <title>เว็บของป๊ะ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/landing/styles.css">
</head>
<body>
  <!-- เพิ่มงานศิลป์ของคุณ: แทนที่ /assets/landing/logo.svg และ /assets/landing/character.svg (ใช้ชื่อไฟล์เดิม หรือแก้ src ของรูปก็ได้ — ใช้ PNG/GIF/APNG ได้)
       To add your art, replace /assets/landing/logo.svg and /assets/landing/character.svg (keep same filenames, or edit the img src; PNG/GIF/APNG also fine). -->

  <a class="logo-slot" href="/">
    <img src="/assets/landing/logo.svg" width="56" height="56" alt="โลโก้เว็บของป๊ะ">
  </a>

  <button class="music-toggle" type="button" aria-pressed="false" aria-label="เปิดเพลงประกอบ">
    <svg class="music-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none">
      <path class="note" d="M10 18V6.4l9-1.7V14.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="note" cx="8.2" cy="18" r="2.6" fill="currentColor"/>
      <circle class="note" cx="17.2" cy="14.4" r="2.6" fill="currentColor"/>
      <line class="mute-slash" x1="4.2" y1="19.8" x2="19.8" y2="4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span>เพลง</span>
  </button>

  <main>
    <div class="character-slot">
      <img src="/assets/landing/character.svg" width="280" height="320" alt="ตัวการ์ตูนทักทาย">
    </div>
    <h1>เว็บของป๊ะ</h1>
    <p class="caption">ดูแลโดย AI agent 🤖</p>
    <a class="enter" href="/classic/">ไปเว็บไซต์เดิม</a>
  </main>

  <script>
    (function () {
      const toggle = document.querySelector(".music-toggle");
      if (!toggle) return;

      const BPM = 100;
      const STEPS_PER_BAR = 8;
      const BARS = 8;
      const LOOP_STEPS = STEPS_PER_BAR * BARS;
      const STEP = 60 / BPM / 2;
      const LOOKAHEAD_MS = 25;
      const SCHEDULE_AHEAD = 0.12;

      const E4 = 329.63, G4 = 392.00, A4 = 440.00, B4 = 493.88;
      const C5 = 523.25, D5 = 587.33, E5 = 659.25, F5 = 698.46, G5 = 783.99, A5 = 880.00;
      const C6 = 1046.50, E6 = 1318.51;

      const melody = [
        C5, E5, G5, E5, C5, D5, E5, G5,
        A4, C5, E5, C5, A4, B4, C5, E5,
        G4, B4, D5, B4, G4, A4, B4, D5,
        C5, E5, G5, C5, B4, D5, G5, 0,
        E5, G5, C5, G5, E5, F5, G5, 0,
        F5, A5, D5, A5, F5, E5, D5, 0,
        E5, G5, C5, E5, D5, F5, B4, D5,
        C5, G4, E4, G4, C5, 0, C5, 0
      ];

      const sparkle = [
        0, 0, G5, 0, 0, C6, 0, E6,
        0, G5, 0, 0, C6, 0, 0, 0,
        0, 0, E6, 0, 0, G5, 0, C6,
        0, 0, 0, G5, 0, 0, E6, 0,
        0, C6, 0, 0, 0, E6, 0, G5,
        0, 0, C6, 0, G5, 0, 0, 0,
        0, E6, 0, 0, C6, 0, G5, 0,
        0, 0, G5, 0, 0, C6, 0, 0
      ];

      let ctx = null;
      let master = null;
      let filter = null;
      let playing = false;
      let timerId = null;
      let nextNoteTime = 0;
      let currentStep = 0;

      function ensureAudio() {
        if (ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        ctx = new AudioCtx();
        master = ctx.createGain();
        master.gain.value = 0.18;
        filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 1600;
        filter.Q.value = 0.7;
        filter.connect(master);
        master.connect(ctx.destination);
      }

      function envelope(gainNode, time, peak, duration) {
        gainNode.gain.setValueAtTime(0.0001, time);
        gainNode.gain.exponentialRampToValueAtTime(peak, time + 0.012);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, time + duration);
      }

      function playVoice(type, freq, time, duration, peak, destination) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, time);
        envelope(gain, time, peak, duration);
        osc.connect(gain);
        gain.connect(destination);
        osc.start(time);
        osc.stop(time + duration + 0.02);
      }

      function scheduleStep(step, time) {
        const mel = melody[step];
        if (mel) {
          playVoice("triangle", mel, time, STEP * 0.92, 0.22, filter);
        }
        const spk = sparkle[step];
        if (spk) {
          playVoice("square", spk, time, STEP * 0.18, 0.018, filter);
        }
      }

      function scheduler() {
        if (!playing || !ctx) return;
        const horizon = ctx.currentTime + SCHEDULE_AHEAD;
        while (nextNoteTime < horizon) {
          scheduleStep(currentStep, nextNoteTime);
          nextNoteTime += STEP;
          currentStep = (currentStep + 1) % LOOP_STEPS;
        }
        timerId = window.setTimeout(scheduler, LOOKAHEAD_MS);
      }

      function start() {
        ensureAudio();
        if (ctx.state === "suspended") ctx.resume();
        playing = true;
        currentStep = 0;
        nextNoteTime = ctx.currentTime + 0.05;
        scheduler();
        toggle.classList.add("is-on");
        toggle.setAttribute("aria-pressed", "true");
        toggle.setAttribute("aria-label", "ปิดเพลงประกอบ");
      }

      function stop() {
        playing = false;
        if (timerId) {
          window.clearTimeout(timerId);
          timerId = null;
        }
        if (ctx && ctx.state === "running") ctx.suspend();
        toggle.classList.remove("is-on");
        toggle.setAttribute("aria-pressed", "false");
        toggle.setAttribute("aria-label", "เปิดเพลงประกอบ");
      }

      toggle.addEventListener("click", function () {
        if (playing) stop();
        else start();
      });
    })();
  </script>
</body>
</html>
